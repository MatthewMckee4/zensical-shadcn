<div class="sh-search">
  <button class="sh-search-trigger" type="button" onclick="onSearchBarClick(event)" aria-haspopup="dialog" aria-controls="search-dialog">
    <svg xmlns="http://www.w3.org/2000/svg" class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <path d="m21 21-4.3-4.3"></path>
    </svg>
    <span class="sh-search-long">Search documentation...</span>
    <span class="sh-search-short">Search...</span>
    <kbd>Cmd K</kbd>
  </button>
</div>
<dialog id="search-dialog" class="sh-search-dialog" onclick="onSearchDialogClick(event)">
  <div class="sh-search-panel">
    <div class="sh-search-input-row">
      <svg xmlns="http://www.w3.org/2000/svg" class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.3-4.3"></path>
      </svg>
      <input id="sh-search-input" placeholder="Search documentation..." autocomplete="off" autocorrect="off" spellcheck="false" oninput="onInputHandler(event)">
    </div>
    <div id="mkdocs-search-results"></div>
  </div>
</dialog>
